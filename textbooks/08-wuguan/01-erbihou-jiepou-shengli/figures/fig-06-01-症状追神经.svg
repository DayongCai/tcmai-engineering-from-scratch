, 422.5)" data-id="M" data-node="true" id="flowchart-M-5" class="node default motor flowchart-label"><rect height="75" width="219" y="-37.5" x="-109.5" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -30)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">运动 · 面神经与舌下神经</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">额纹消失+闭目不全 → 周围性</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">仅口角垂·额纹在 → 中枢性</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">伸舌偏斜+萎缩束颤 → 舌下</tspan></text></g></g><g transform="translate(688, 422.5)" data-id="P" data-node="true" id="flowchart-P-7" class="node default motor flowchart-label"><rect height="60" width="256" y="-30" x="-128" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -22.5)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">咽与喉 · 舌咽与迷走</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">咽感觉减·舌根味觉差 → 舌咽</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">声嘶·饮水呛咳·声带麻痹 → 迷走</tspan></text></g></g><g transform="translate(400.5, 540)" data-id="R" data-node="true" id="flowchart-R-9" class="node default gate flowchart-label"><rect height="60" width="180" y="-30" x="-90" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -22.5)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">判据：单条症状只作提示</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">定位需三条同平面</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">或有一个解剖关口</tspan></text></g></g></g></g></g></svg>
