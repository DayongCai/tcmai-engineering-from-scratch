 coch flowchart-label"><rect height="30" width="195" y="-15" x="-97.5" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -7.5)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">耳蜗：行波→频率译为位置</tspan></text></g></g><g transform="translate(295, 292.5)" data-id="D" data-node="true" id="flowchart-D-9" class="node default coch flowchart-label"><rect height="45" width="150" y="-22.5" x="-75" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -15)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">外毛细胞：耳蜗放大</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">敏感·调谐·压缩</tspan></text></g></g><g transform="translate(295, 387.5)" data-id="E" data-node="true" id="flowchart-E-11" class="node default coch flowchart-label"><rect height="45" width="180" y="-22.5" x="-90" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -15)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">内毛细胞：机械转电信号</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">听神经→脑干，多次交叉</tspan></text></g></g><g transform="translate(295, 497.5)" data-id="J" data-node="true" id="flowchart-J-13" class="node default bone flowchart-label"><rect height="75" width="211" y="-37.5" x="-105.5" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -30)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">三个落点</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">气导降·骨导不变 → 传导段</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">气导降·骨导也降 → 感音段</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">都降且气更差 → 混合</tspan></text></g></g></g></g></g></svg>
