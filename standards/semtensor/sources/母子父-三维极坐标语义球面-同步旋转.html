<title>tcmP · 颜色赋值三维极坐标语义张量 · 母子父三球面同步旋转图</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#121722; --panel2:#171e2b; --line:#25304a;
    --fg:#e8edf7; --muted:#93a1bd; --accent:#00B050;
    --x-i:#FF8C00; --x-t:#8A2BE2; --y-i:#1F61D9; --y-t:#DB1C1C; --z-i:#F2C200; --z-t:#00C7C7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,-apple-system,sans-serif;}
  header{padding:14px 20px 10px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:40}
  h1{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:.4px}
  .sub{color:var(--muted);font-size:12.5px;line-height:1.6}
  .sub code{background:#0d1420;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:#cfe3ff}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  button,label.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
  button:hover,label.btn:hover{border-color:var(--accent);color:#fff}
  button.on{background:var(--accent);color:#04170c;border-color:var(--accent);font-weight:700}
  .sep{width:1px;height:22px;background:var(--line)}
  .rng{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
  input[type=range]{width:120px;accent-color:var(--accent)}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 20px 0}
  @media (max-width:1100px){#grid{grid-template-columns:1fr}}
  figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .fighd{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .fighd .no{font-size:19px;font-weight:800}
  .fighd .nm{font-size:14.5px;font-weight:700}
  .fighd .tag{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.45}
  .stage{position:relative;width:100%;aspect-ratio:1/0.92;background:radial-gradient(circle at 50% 42%,#151c29 0%,#0b0e13 78%)}
  .stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  .stage canvas.drag{cursor:grabbing}
  .lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:11px;
       color:#dbe6fb;text-shadow:0 0 4px #000,0 0 8px #000;white-space:nowrap}
  .lbl.axis{font-size:14px;font-weight:800;letter-spacing:.5px}
  .lbl.tick{font-size:10px;color:#a9b8d6}
  .lbl.iot{font-size:9.5px;color:#e6eeff;opacity:.92}
  .tip{position:absolute;pointer-events:none;background:#0a0f18f2;border:1px solid var(--accent);
       border-radius:6px;padding:6px 9px;font-size:12px;line-height:1.55;max-width:250px;display:none;z-index:20;
       box-shadow:0 6px 20px #000a}
  .tip b{color:#fff}
  .tip .kv{color:var(--muted)}
  figcaption{padding:10px 12px 12px;border-top:1px solid var(--line);background:#0f141e}
  figcaption h4{margin:0 0 6px;font-size:12.5px;color:var(--accent);letter-spacing:.5px;font-weight:700}
  pre.cap{margin:0;white-space:pre-wrap;word-break:break-word;font-size:11.8px;line-height:1.75;
          color:#c9d6ee;max-height:230px;overflow:auto;font-family:"Microsoft YaHei",monospace}
  .capbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .capbar button{padding:4px 9px;font-size:11.5px}
  textarea{width:100%;min-height:170px;background:#0a0e16;color:#d7e3f8;border:1px solid var(--line);
           border-radius:6px;font-family:Consolas,"Microsoft YaHei",monospace;font-size:11.5px;line-height:1.6;padding:8px}
  .ed{display:none;margin-top:8px}
  .ed.open{display:block}
  footer{margin:16px 20px 30px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  footer h3{margin:0 0 8px;font-size:13.5px;color:var(--accent)}
  table{border-collapse:collapse;font-size:12px;margin:6px 0 14px;width:100%;max-width:760px}
  th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}
  th{background:var(--panel2);color:var(--muted);font-weight:600}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #0006;vertical-align:-2px;margin-right:6px}
  .note{color:var(--muted);font-size:12px;line-height:1.75}
  .ok{color:var(--accent)}
</style>
</head>

    <code>r = 尺度 ∈ (0,1]</code>　球→笛：<code>X = r·cosθ·cosφ , Y = r·cosθ·sinφ , Z = r·sinθ</code>

  <div class="toolbar">

    <button id="btnGrid" class="on">球面点云 开</button>
    <button id="btnAxes" class="on">坐标轴 开</button>
    <button id="btnShot">导出整图 PNG</button>
  </div>
</header>

i":2.677945044588987},"DOM-SYS-生理":{"theta":-1.4056476493802699,"phi":1.5707963267948966},"DOM-SYS-心理":{"theta":1.4149359490883244,"phi":5.497787143782138},"DOM-SYS-社会":{"theta":0.5908727501454191,"phi":5.176036589385496},"DOM-SYS-生态":{"theta":0.0,"phi":4.3906384259880475},"DOM-JQS-精":{"theta":-1.5707963267948966,"phi":0.0},"DOM-JQS-气":{"theta":1.5707963267948966,"phi":0.0},"DOM-JQS-神":{"theta":1.5707963267948966,"phi":0.0}},"captions":{"母":"# tcmP 中医药网络教育平台 · 颜色赋值三维极坐标语义张量 · 球面图注\n# 本文件为纯文本，可直接编辑。\n# 在 interactive HTML 中用「编辑图注文本 → 应用参数并重绘」或\n# 「从文件载入 .txt」，即可完成【参数应用实例化】。\n# 单一来源：kg/semtensor/axioms.py（颜色公理）与 semtensor/encoder.py（三轴映射）\n# 口径裁定（本系统唯一口径）：\n#   θ = 仰角 elevation ∈ [−90°, +90°]（赤道 0，天顶 +90°，天底 −90°）\n#   φ = 方位角 azimuth ∈ [0°, 360°)（自 +X 轴起算，绕 +Z 轴逆时针）\n#   球 → 笛卡尔：X = r·cosθ·cosφ ， Y = r·cosθ·sinφ ， Z = r·sinθ\n#   笛 → 球    ：r = |v| ， θ = arcsin(Z/r) ， φ = atan2(Y, X)\n#   旧稿（θ=极角 0..180°）换算：θ_仰角 = 90° − θ_极角 ，φ 不变\n\n[球]\nno = ①\nname = 母\nsex = 女\nsign = −1 −1 +1\nangle_x = 180\nangle_y = 135\nangle_z = 90\nxy_face = 3π/4\nmirror_point_cloud = 1\n\n[参数]\nrings = 45\nseg = 70\nazimuth_step_deg = 30\nelev_ticks_deg = -60,-30,0,30,60\narrow_head = 6.5\ndot_iot = 1.7\ndot_edge = 0.35\ndot_O = 1.8\ncloud_point_size = 4.0\nmarker_point_size = 32.0\niot_point_size = 26.0\ncloud_alpha_rim = 0.95\ncloud_alpha_face = 0.3\nmarker_alpha_rim = 1.0\nmarker_alpha_face = 0.72\nview_elev_deg = 20\nview_azim_deg = -60\nmirror_point_cloud = 1\n\n[图注正文]\n图  tcmP · 颜色赋值三维极坐标语义张量 —— ①母球面（单位球面 r = 1.0）\n\n■ 一、本球身份\n①母球面，性别女；镜像符号 (sx,sy,sz) = (−1 −1 +1)\n（球面点云 = 镜像算子 M 作用于基准方向 n̂(θ,φ)：母球 M = diag(−1,−1,+1)，子/父球 M = I）\n三维正交坐标：X–Z 真实夹角 = (1/2)π；X–Y 图面夹角 = 3π/4（依规格 0401：男 (1/4)π、女 (3/4)π）\n三轴图面角：X+ = 180°，Y+ = 135°，Z+ = 90°\n\n■ 二、口径（本系统唯一口径）\nθ = 仰角 elevation ∈ [−90°,+90°]；φ = 方位角 azimuth ∈ [0°,360°)。\n球→笛：X = r·cosθ·cosφ，Y = r·cosθ·sinφ，Z = r·sinθ；r ∈ (0,1] 为「语义张量尺度」。\n球面图按单位球面 r = 1.0 作图（方向承载语义）；「尺度伸缩 ×k」滑杆把 r 映射到点半径，作尺度可视化。\n赤道 = θ = 0（细虚线）；φ = 0°/180° 两条经线为方位基准；φ = 90°/270° 大圆为阴阳界（X = 0）。\n\n■ 三、三轴语义与轴端取色（母/子/父 三球共用同一张轴色表）\nX（左右）阴阳轴   ：I −1 阴 · O 0 中 · T +1 阳 　端色 橙605nm/绿533nm/紫415nm\nY（前后）表里轴   ：I −1 表 · O 0 半表半里 · T +1 里 　端色 蓝458nm/绿533nm/红685nm\nZ（足→首）精气神轴：I −1 精 · O 0 气 · T +1 神 　端色 黄578nm/绿533nm/青493nm\nO 点三轴共有基准色 = 绿 #00B050（不是灰）。\n轴端色取「可见光波长序段中位数」为基准：红685/橙605/黄578/绿533/青493/蓝458/紫415（nm）。\n\n■ 四、颜色公理（单一来源 axioms.comp）\n单轴渐变 ramp(t,轴)：在 [−1,0,+1] 三色间逐通道线性插值。\n合成色：w_i = clip(|v_i|,0,1)；k = max(w_i)；C = (1−k)·绿 + k·(Σ w_i·c_i / Σ w_i)。\n性质：① O 点任意轴都回到基准绿；② 三轴同强时趋向三端色加权混合；\n　　　③ 镜像不变色——球面**几何**随球镜像（M(女)=diag(−1,−1,+1)，φ→φ+180°），\n　　　　 **取色坐标**作反镜像补偿（即文档 0403 的「各球按自身轴正向取色的符号」），\n　　　　 ⇒ 同一语义单元在母/子/父三球上同色，三球共用同一张轴色表。\n\n■ 五、本球语义点云\n语义单元总数（DSU）116，本球绘制 103 个；域级节点 13 个（六经域 6 + 四系统 4 + 精气神 3）。\n点半径 ∝ r（尺度）；点色 = 该单元三分量 (x,y,z) 的合成色。\n本球镜像：开（与子/父球关于 Z 轴呈 π 旋转的男女镜像）\n\n■ 六、网格与离散微分几何（DDG）校验\n经向环 45 × 纬向点 70 = 顶点 3152，三角面 6300；\n点云降采样 45×70 = 3150（闭合球须补极点顶点与三角扇，否则曲率全废）。\n曲率密度 K = 角度亏损 / 对偶胞面积 ≈ 1；Gauss–Bonnet：ΣK·A = Σ角度亏损 = 4π = 12.56637061436（闭合球上精确成立）；\nEuler 示性数 V − E + F = 2。\n\n■ 七、交互（三维可同步旋转）\n三球共用同一相机状态（仰角/方位角/距离），拖动任一球面即三球同步旋转；滚轮同步缩放；\n自动旋转、视角预设（前视 20°,−60° / 正视 XZ / 俯视 / 侧视 YZ）作用于全部三球。\n点云透明度由离散法向驱动：轮廓 |n·v|→0 最不透明（0.95），正对观察者处最透明（0.3），\n近大远小并按深度排序绘制（depthshade=False——颜色即数据，不被深度调淡）。\n悬停任一语义点显示 标签 / θ仰角 / φ方位角 / r / 三分量 / 合成色 HEX。\n\n■ 八、画布规范\n画布内不出现汉字：只用 X/Y/Z、θ/φ 数字与圈号 ①②③；汉字母语（本注）全部下沉到本文件。\n","子":"# tcmP 中医药网络教育平台 · 颜色赋值三维极坐标语义张量 · 球面图注\n# 本文件为纯文本，可直接编辑。\n# 在 interactive HTML 中用「编辑图注文本 → 应用参数并重绘」或\n# 「从文件载入 .txt」，即可完成【参数应用实例化】。\n# 单一来源：kg/semtensor/axioms.py（颜色公理）与 semtensor/encoder.py（三轴映射）\n# 口径裁定（本系统唯一口径）：\n#   θ = 仰角 elevation ∈ [−90°, +90°]（赤道 0，天顶 +90°，天底 −90°）\n#   φ = 方位角 azimuth ∈ [0°, 360°)（自 +X 轴起算，绕 +Z 轴逆时针）\n#   球 → 笛卡尔：X = r·cosθ·cosφ ， Y = r·cosθ·sinφ ， Z = r·sinθ\n#   笛 → 球    ：r = |v| ， θ = arcsin(Z/r) ， φ = atan2(Y, X)\n#   旧稿（θ=极角 0..180°）换算：θ_仰角 = 90° − θ_极角 ，φ 不变\n\n[球]\nno = ②\nname = 子\nsex = 男\nsign = +1 +1 +1\nangle_x = 0\nangle_y = 45\nangle_z = 90\nxy_face = π/4\nmirror_point_cloud = 1\n\n[参数]\nrings = deg = -60\nmirror_point_cloud = 1\n\n[图注正文]\n图 1  tcmP 中医药网络教育平台 · 颜色赋值三维极坐标语义张量\n　　　（①母 ②子 ③父 三球面同步旋转；θ = 仰角，φ = 方位角）\n\n■ 一、模型定位\n承载对象：中医药语义单元（病证单元 DSU／六经域／四系统／精气神三宝）。\n承载方式：**方向承载语义**——每个语义单元归一为单位球面上的一个方向 n̂(θ,φ)；\n　　　　　r ∈ (0,1] 承载「语义张量尺度」，供平台做尺度伸缩（扩缩容、加权、剪枝）。\n读色方式：点的颜色 ← 该点三轴坐标按颜色公理合成 ⇒ 色—义一一对应（颜色是坐标的函数，不是装饰）；\n　　　　　同类语义聚色成区，便于读「聚集 / 类别 / 相关」。\n\n■ 二、三球与男女镜像\n①母球面（女）：右侧属阳、左侧属阴（右阳左阴），镜像符号 (sx,sy,sz) = (−1,−1,+1)\n②子球面（男）、③父球面（男）：镜像符号 (sx,sy,sz) = (+1,+1,+1)\n三者迎面走向医生：医生「左侧-中间-右侧」= 母-子-父；三者左手侧 = 医生右手侧。\n男女镜像由算子 M(女) = diag(−1,−1,+1) 实现：几何位置 φ → φ + 180°（θ 不变），\n取色坐标作反镜像补偿 ⇒ **同一语义单元在母/子/父三球上同色**，\n故母/子/父 三类单位球面点着色表完全相同（与 README §3 一致）。\n二维表现：X–Y 图面夹角 男 = (1/4)π、女 = (3/4)π（规格 0401）；三轴图面角 男 0°/45°/90°、女 180°/135°/90°。\n\n■ 三、口径（本系统唯一口径，取代旧稿的 θ=极角）\nθ = 仰角 elevation ∈ [−90°, +90°]（赤道 0，天顶 +90°，天底 −90°）；\nφ = 方位角 azimuth ∈ [0°, 360°)（自 +X 轴起算，绕 +Z 轴逆时针）。\n球→笛：X = r·cosθ·cosφ ，Y = r·cosθ·sinφ ，Z = r·sinθ；\n笛→球：r = |v| ，θ = arcsin(Z/r) ，φ = atan2(Y,X)。\n旧稿换算：θ_仰角 = 90° − θ_极角；旧稿「赤道 θ=π/2」 → 「赤道 θ=0」；旧稿「极点 θ=0/π」 → 「θ=±π/2」。\n\n■ 四、三轴语义与轴端取色表（三球共用）\n轴              I (−1)                O (0)                T (+1)\nX 左右·阴阳    橙 605nm #FF8C00      绿 533nm #00B050     紫 415nm #8A2BE2\nY 前后·表里    蓝 458nm #1F61D9      绿 533nm #00B050     红 685nm #DB1C1C\nZ 足→首·精气神 黄 578nm #F2C200      绿 533nm #00B050     青 493nm #00C7C7\nO 点三轴共有基准色 = 绿（不是灰）；轴端色取「可见光波长序段中位数」为基准。\n\n■ 五、颜色公理\nramp(t,轴) 在 [−1,0,+1] 三色间逐通道线性插值；\nw_i = clip(|v_i|,0,1)，k = max(w_i)，C = (1−k)·绿 + k·(Σ w_i·c_i / Σ w_i)。\n关键性质：O 点任意轴都回到基准绿；三轴同强时颜色趋向三端色加权混合；镜像不变色。\n\n■ 六、语义映射（可计算）\nx = 0.60·阴阳(八纲) + 0.40·寒热(八纲) 　→ −1 阴 / 0 中 / +1 阳\ny = 0.70·表里(八纲) + 0.30·虚实(八纲) 　→ −1 表 / 0 半表半里 / +1 里\nz = (神分 − 精分)/(精分 + 气分 + 神分 + 1)（关键词判位）→ −1 精 / 0 气 / +1 神\nr = clip(0.35·证据等级 + 0.35·症状密度 + 0.30·桥接完备度, 0.20, 1.00)\nθ = arcsin(z/|v|) ，φ = atan2(y, x) ，C = comp(x,y,z)\n\n■ 七、语义单元索引（数字 ↔ 语义，按 r 降序前 60 条）\n序号  语义单元                  尺度 r   仰角 θ      方位角 φ      合成色\n    1  肝阳上亢证(头部)                r=0.86  θ=  27.94°  φ=  45.00°  #338A6 const C_O = [0.000,0.690,0.314];
const AXIS_EP = {
  X:{ I:{nm:"橙",nm_:605,c:[1.000,0.549,0.000],hex:"#FF8C00"},
      O:{nm:"绿",nm_:533,c:C_O,hex:"#00B050"},
      T:{nm:"紫",nm_:415,c:[0.541,0.169,0.886],hex:"#8A2BE2"} },
  Y:{ I:{nm:"蓝",nm_:458,c:[0.122,0.380,0.851],hex:"#1F61D9"},
      O:{nm:"绿",nm_:533,c:C_O,hex:"#00B050"},
      T:{nm:"红",nm_:685,c:[0.859,0.110,0.110],hex:"#DB1C1C"} },
  Z:{ I:{nm:"黄",nm_:578,c:[0.949,0.761,0.000],hex:"#F2C200"},
      O:{nm:"绿",nm_:533,c:C_O,hex:"#00B050"},
      T:{nm:"青",nm_:493,c:[0.000,0.780,0.780],hex:"#00C7C7"} }
};
const AXES=["X","Y","Z"];
function ramp(t,axis){
  t=Math.max(-1,Math.min(1,t));
  const E=AXIS_EP[axis], cI=E.I.c, cO=E.O.c, cT=E.T.c;
  const a = t<0 ? [cI,cO,t+1] : [cO,cT,t];
  return [a[0][0]+(a[1][0]-a[0][0])*a[2],
          a[0][1]+(a[1][1]-a[0][1])*a[2],
          a[0][2]+(a[1][2]-a[0][2])*a[2]];
}
function comp(v){
  const w=[Math.min(1,Math.abs(v[0])),Math.min(1,Math.abs(v[1])),Math.min(1,Math.abs(v[2]))];
  const k=Math.max(w[0],w[1],w[2]), s=w[0]+w[1]+w[2];
  if(s<1e-12||k<=0) return C_O.slice();
  const m=[0,0,0];
  for(let i=0;i<3;i++){const c=ramp(v[i],AXES[i]); m[0]+=w[i]*c[0]; m[1]+=w[i]*c[1]; m[2]+=w[i]*c[2];}
  return [0,1,2].map(i=>Math.max(0,Math.min(1,(1-k)*C_O[i]+k*m[i]/s)));
}
function hexs(c){return "#"+c.map(x=>Math.round(Math.max(0,Math.min(1,x))*255).toString(16).padStart(2,"0").toUpperCase()).join("");}
function sph(th,ph,r){const ct=Math.cos(th);return [r*ct*Math.cos(ph),r*ct*Math.sin(ph),r*Math.sin(th)];}

function mPersp(fovy,asp,zn,zf){const f=1/Math.tan(fovy/2);const nf=1/(zn-zf);
  return new Float32Array([f/asp,0,0,0, 0,f,0,0, 0,0,(zf+zn)*nf,-1, 0,0,2*zf*zn*nf,0]);}
function mMul(a,b){const o=new Float32Array(16);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;}
function mLookAt(eye,ctr,up){
  const z=nrm(sub(eye,ctr)), x=nrm(cross(up,z)), y=cross(z,x);
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -dot(x,eye),-dot(y,eye),-dot(z,eye),1]);}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function nrm(a){const n=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/n,a[1]/n,a[2]/n];}

/* ---------- 几何构造 ---------- */
function buildCloud(mirror){
  const R=DATA.params.rings, S=DATA.params.seg;
  const M = mirror ? DATA.mirror[mirror] || [1,1,1] : [1,1,1];
  const pos=[],col=[];
  for(let i=1;i<R;i++){
    const th = -Math.PI/2 + Math.PI*i/R;
    for(let j=0;j<S;j++){
      const ph = 2*Math.PI*j/S;
      const n = sph(th+Math.PI/(2*R), ph, 1.0);   // 单元自身方向 n̂（半格偏移，避开极点汇聚）
      const p = [n[0]*M[0], n[1]*M[1], n[2]*M[2]]; // 球面位置 = M·n̂（几何镜像）
      const cc = [p[0]*M[0], p[1]*M[1], p[2]*M[2]];// 取色坐标 = M·p = n̂（反镜像补偿）
      const c = comp(cc);
      pos.push(p[0],p[1],p[2]); col.push(c[0],c[1],c[2]);
    }
  }
  return {pos:new Float32Array(pos), col:new Float32Array(col), n:pos.length/3};
}
function buildMarkers(units, mirror, scaleK){
  const M = mirror ? DATA.mirror[mirror] || [1,1,1] : [1,1,1];
  const pos=[],col=[],list=[];
  units.forEach(u=>{
    const n=DATA.units_sph[u.uid]; if(!n) return;
    const r=Math.max(0.06,Math.min(1,u.r))*scaleK;
    let p=sph(n.theta,n.phi,r); p=[p[0]*M[0],p[1]*M[1],p[2]*M[2]];
    const c=comp([u.x,u.y,u.z]);
    pos.push(p[0],p[1],p[2]); col.push(c[0],c[1],c[2]);
    list.push({p:p,u:u,r:r,c:c,hex:hexs(c)});
  });
  return {pos:new Float32Array(pos),col:new Float32Array(col),
          n:pos.length/3, list:list};
}

    let a=sph(0, 2*Math.PI*i/SEG,1.005), b=sph(0, 2*Math.PI*(i+1)/SEG,1.005);
    a=[a[0]*M[0],a[1]*M[1],a[2]*M[2]]; b=[b[0]*M[0],b[1]*M[1],b[2]*M[2]];
    push(a,b,[0.45,0.52,0.68],[0.45,0.52,0.68]);
  }
  // 方位角刻度（每 step 度，赤道外侧短须）
  const st=DATA.params.azimuth_step_deg;
  for(let d=0;d<360;d+=st){
    const ph=d*Math.PI/180;
    let a=sph(0,ph,1.005), b=sph(0,ph,1.06);
    a=[a[0]*M[0],a[1]*M[1],a[2]*M[2]]; b=[b[0]*M[0],b[1]*M[1],b[2]*M[2]];
    push(a,b,[0.72,0.79,0.94],[0.72,0.79,0.94]);
  }
  return {pos:new Float32Array(pos),col:new Float32Array(col),n:pos.length/3};
}
/* 三轴：两段三点 I/O/T + 实体箭头（世界空间圆管，随视角稳定可见） */
function rod(p0,c0,p1,c1,rad,pos,col,sides,nsub){
  let d=[p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]];
  const L=Math.hypot(d[0],d[1],d[2])||1; d=[d[0]/L,d[1]/L,d[2]/L];
  const up=Math.abs(d[2])>0.9?[1,0,0]:[0,0,1];
  const e1=nrm(cross(d,up)), e2=cross(d,e1);
  const rings=[];
  for(let i=0;i<=nsub;i++){
    const t=i/nsub;
    const c=[c0[0]+(c1[0]-c0[0])*t, c0[1]+(c1[1]-c0[1])*t, c0[2]+(c1[2]-c0[2])*t];
    const b=[p0[0]+d[0]*t*L, p0[1]+d[1]*t*L, p0[2]+d[2]*t*L];
    const row=[];
    for(let k=0;k<sides;k++){
      const a=2*Math.PI*k/sides, ca=Math.cos(a), sa=Math.sin(a);
      row.push([b[0]+rad*(e1[0]*ca+e2[0]*sa), b[1]+rad*(e1[1]*ca+e2[1]*sa),
                b[2]+rad*(e1[2]*ca+e2[2]*sa), c]);
    }
    rings.push(row);
  }
  for(let i=0;i<nsub;i++)for(let k=0;k<sides;k++){
    const k2=(k+1)%sides;
    const A=rings[i][k], B=rings[i][k2], C=rings[i+1][k2], D=rings[i+1][k];
    pos.push(A[0],A[1],A[2], B[0],B[1],B[2], C[0],C[1],C[2]);
    col.push(...A[3],...B[3],...C[3]);
    pos.push(A[0],A[1],A[2], C[0],C[1],C[2], D[0],D[1],D[2]);
    col.push(...A[3],...C[3],...D[3]);
  }
}
function cone(base,cb,tip,ct,rad,pos,col,sides){
  let d=[tip[0]-base[0],tip[1]-base[1],tip[2]-base[2]];
  const L=Math.hypot(d[0],d[1],d[2])||1; d=[d[0]/L,d[1]/L,d[2]/L];
  const up=Math.abs(d[2])>0.9?[1,0,0]:[0,0,1];
  const e1=nrm(cross(d,up)), e2=cross(d,e1);
  const ring=[];
  for(let k=0;k<sides;k++){
    const a=2*Math.PI*k/sides, ca=Math.cos(a), sa=Math.sin(a);
    ring.push([base[0]+rad*(e1[0]*ca+e2[0]*sa), base[1]+rad*(e1[1]*ca+e2[1]*sa),
               base[2]+rad*(e1[2]*ca+e2[2]*sa)]);
  }
  for(let k=0;k<sides;k++){
    const k2=(k+1)%sides;
    pos.push(...tip,...ring[k],...ring[k2]); col.push(...ct,...cb,...cb);
    pos.push(...base,...ring[k2],...ring[k]); col.push(...cb,...cb,...cb);
  }
}
function buildAxes(mirror){
  const M = mirror ? DATA.mirror[mirror] || [1,1,1] : [1,1,1];
  const m = v => [v[0]*M[0], v[1]*M[1], v[2]*M[2]];
  const pos=[],col=[],ipos=[],icol=[],list=[];
  const A=[[1,0,0],[0,1,0],[0,0,1]];
  const S=1.15, ROD=0.0085, HEAD=0.030, HEADL=0.13;
  AXES.forEach((ax,i)=>{
    const dSrc=A[i], dir=m(dSrc);
    const cI=AXIS_EP[ax].I.c, cO=C_O.slice(), cT=AXIS_EP[ax].T.c;
    const pI=m([-S*dSrc[0],-S*dSrc[1],-S*dSrc[2]]), pO=[0,0,0],
          pT=m([ S*dSrc[0], S*dSrc[1], S*dSrc[2]]);
    rod(pI,cI,pO,cO,ROD,pos,col,10,10);                 // 负值段 I→O
    rod(pO,cO,pT,cT,ROD,pos,col,10,10);                 // 正值段 O→T
    cone(m([dSrc[0]*(S-HEADL),dSrc[1]*(S-HEADL),dSrc[2]*(S-HEADL)]),cT,pT,cT,HEAD,pos,col,16);
    // I / O / T 三点
    [[pI,cI,'I(−1)',-S],[pO,cO,'O(0)',0],[pT,cT,'T(+1)',S]].forEach(([p,c,nm,t])=>{
      ipos.push(p[0],p[1],p[2]); icol.push(...c);
      list.push({kind:"iot",label:nm,pos:p,col:c,ax:ax});
    });
    list.push({kind:"axis",label:ax,pos:m([dSrc[0]*1.30,dSrc[1]*1.30,dSrc[2]*1.30]),col:cT});
  });
  return {pos:new Float32Array(pos),col:new Float32Array(col),n:pos.length/3,
          iot:{pos:new Float32Array(ipos),col:new Float32Array(icol),n:ipos.length/3},
          list:list};
}

/* ---------- 单球渲染器 ---------- */
class SphereView{
  constructor(sphere, root){
    this.sphere=sphere;
    this.stage=root.querySelector(".stage");
    this.cv=root.querySelector("canvas");
    this.tip=root.querySelector(".tip");
    const gl=this.cv.getContext("webgl",{antialias:true,alpha:false,preserveDrawingBuffer:true});
    this.gl=gl;
    if(!gl){this.stage.innerHTML='<div class="lbl" style="position:static;padding:20px">当前浏览器不支持 WebGL</div>';return;}
    this.pCloud=prog(gl,VS_HDR+VS_PT,FS_PT);
    this.pLine=prog(gl,VS_LN,FS_LN);
    this.geo={};
    this.rebuild();
    this.labels=[];
    this.buildLabels();
    this.bindPointer();
  }
  upload(key){
    const gl=this.gl, g=this.geo[key];
    if(!g.buf) g.buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,g.buf); gl.bufferData(gl.ARRAY_BUFFER,g.pos,gl.DYNAMIC_DRAW);
    if(!g.cbuf) g.cbuf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,g.cbuf); gl.bufferData(gl.ARRAY_BUFFER,g.col,gl.DYNAMIC_DRAW);
  }
  rebuild(){
    const cur=window.__ST_STATE__;
    const sex = cur.mirror ? this.sphere.sex : null;
    this.geo.cloud=buildCloud(sex);
    this.geo.lines=buildLines(sex);
    this.geo.axes =buildAxes(sex);
    this.geo.iot  =this.geo.axes.iot;
    const us=DATA.units.filter(u=>DATA.units_sph[u.uid]);
    this.geo.mk=buildMarkers(us, sex, cur.scaleK);
    Object.keys(this.geo).forEach(k=>this.upload(k));
    this.axisLabels=this.geo.axes.list;
  }
  buildLabels(){
    const wrap=document.createElement("div");
    this.stage.querySelectorAll(".lbl.dyn").forEach(e=>e.remove());
    const mk=(cls,txt,color)=>{const d=document.createElement("div");
      d.className="lbl "+cls+" dyn"; if(color)d.style.color=color; d.textContent=txt;
      this.stage.appendChild(d); return d;};
    this.labels=[];
    AXES.forEach(ax=>{this.labels.push({el:mk("axis",ax,"#ffffff"),p:null,kind:"ax",ref:ax});});
    const st=DATA.params.azimuth_step_deg;
    for(let d=0;d<360;d+=st){
      const el=mk("tick",d+"°","#a9b8d6");
      const ph=d*Math.PI/180;
      this.labels.push({el:el,p:sph(0,ph,1.12),kind:"tick",phi:ph});
    }
    // I(−1) / O(0) / T(+1) 三点标签（画布内只用字母+数字，无汉字）
    this.iotLbl=(this.geo.axes.list||[]).filter(o=>o.kind==="iot").map(o=>({
      el:mk("iot",o.label,hexs(o.col)), p:o.pos, ref:o.ax}));
    this.iotEls=[];
  }
  bindPointer(){
    const cv=this.cv;
    cv.addEventListener("pointerdown",e=>{cv.classList.add("drag");
      this.drag={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId);});
    cv.addEventListener("pointerup",e=>{cv.classList.remove("drag");this.drag=null;});
    cv.addEventListener("pointermove",e=>{
      if(this.drag){ CAM.azim -= (e.clientX-this.drag.x)*0.008;
                     CAM.elev = Math.max(-1.53,Math.min(1.53,CAM.elev+(e.clientY-this.drag.y)*0.006));
                     this.drag={x:e.clientX,y:e.clientY}; }
      else this.pick(e);
    });
    cv.addEventListener("pointerleave",()=>{this.tip.style.display="none";});
    cv.addEventListener("wheel",e=>{e.preventDefault();
      CAM.dist=Math.max(1.55,Math.min(7.5,CAM.dist*(1+Math.sign(e.deltaY)*0.08)));},{passive:false});
  }
  resize(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const r=this.cv.getBoundingClientRect();
    const w=Math.max(80,Math.round(r.width*dpr)), h=Math.max(80,Math.round(r.height*dpr));
    if(this.cv.width!==w||this.cv.height!==h){this.cv.width=w;this.cv.height=h;}
    this.aspect=w/h; this.dpr=dpr; this.cssW=r.width; this.cssH=r.height;
  }
  draw(){
    const gl=this.gl; if(!gl) return;
    this.resize();
    gl.viewport(0,0,this.cv.width,this.cv.height);
    gl.clearColor(0.043,0.055,0.075,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    const eye=camEye(), proj=mPersp(38*Math.PI/180,this.aspect,0.1,100), view=mLookAt(eye,[0,0,0],[0,0,1]);
    const cur=window.__ST_STATE__;
    const uK=this.cv.height/540;

    // 球面点云（色场：三轴合成色映射到球面）
    if(cur.showGrid){
      gl.useProgram(this.pCloud);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.pCloud,"uProj"),false,proj);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.pCloud,"uView"),false,view);
      gl.uniform1f(gl.getUniformLocation(this.pCloud,"uScale"),uK*1.0);
      gl.uniform3fv(gl.getUniformLocation(this.pCloud,"uEye"),eye);
      gl.uniform1f(gl.getUniformLocation(this.pCloud,"uSizeK"),DATA.params.cloud_point_size*this.dpr);
      gl.uniform1f(gl.getUniformLocation(this.pCloud,"uAlphaRim"),DATA.params.cloud_alpha_rim);
      gl.uniform1f(gl.getUniformLocation(this.pCloud,"uAlphaFace"),DATA.params.cloud_alpha_face);
      this.bindPt(this.pCloud,this.geo.cloud);
      gl.drawArrays(gl.POINTS,0,this.geo.cloud.n);
    }
    // 网格线
    gl.useProgram(this.pLine);
    gl.uniformMatrix4fv(gl.getUniformLocation(this.pLine,"uProj"),false,proj);
    gl.uniformMatrix4fv(gl.getUniformLocation(this.pLine,"uView"),false,view);
    gl.uniform1f(gl.getUniformLocation(this.pLine,"uAlpha"),0.85);
    this.bindLn(this.pLine,this.geo.lines);
    gl.drawArrays(gl.LINES,0,this.geo.lines.n);
    // 三轴（实体圆管 + 箭头）
    if(cur.showAxes){
      gl.uniform1f(gl.getUniformLocation(this.pLine,"uAlpha"),1.0);
      this.bindLn(this.pLine,this.geo.axes);
      gl.drawArrays(gl.TRIANGLES,0,this.geo.axes.n);
      gl.useProgram(this.pCloud);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.pCloud,"uProj"),false,proj);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.pCloud,"uView"),false,view);
      gl.uniform1f(gl.getUniformLocation(this.pCloud,"uScale"),uK*1.0);
      gl.uniform3fv(gl.getUniformLocation(this.pCloud,"uEye"),eye);
      gl.uniform1f(gl.getUniformLocation(this.pCloud,"uSizeK"),DATA.params.iot_point_size*this.dpr);
      gl.uniform1f(gl.getUniformLocation(this.pCloud,"uAlphaRim"),1.0);
      gl.uniform1f(gl.getUniformLocation(this.pCloud,"uAlphaFace"),1.0);
      this.bindPt(this.pCloud,this.geo.iot);
      gl.drawArrays(gl.POINTS,0,this.geo.iot.n);
    }
    // 语义单元散点（张量点云）
    gl.useProgram(this.pCloud);
    gl.uniformMatrix4fv(gl.getUniformLocation(this.pCloud,"uProj"),false,proj);
    gl.uniformMatrix4fv(gl.getUniformLocation(this.pCloud,"uView"),false,view);
    gl.uniform1f(gl.getUniformLocation(this.pCloud,"uScale"),uK*1.0);
    gl.uniform3fv(gl.getUniformLocation(this.pCloud,"uEye"),eye);
    gl.uniform1f(gl.getUniformLocation(this.pCloud,"uSizeK"),DATA.params.marker_point_size*this.dpr);
    gl.uniform1f(gl.getUniformLocation(this.pCloud,"uAlphaRim"),DATA.params.marker_alpha_rim);
    gl.uniform1f(gl.getUniformLocation(this.pCloud,"uAlphaFace"),DATA.params.marker_alpha_face);
    this.bindPt(this.pCloud,this.geo.mk);
    gl.drawArrays(gl.POINTS,0,this.geo.mk.n);

    this.proj=proj; this.view=view; this.eye=eye;
    this.placeLabels(cur);
  }
  bindPt(p,g){
    const gl=this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER,g.buf);
    const a1=gl.getAttribLocation(p,"aPos"); gl.enableVertexAttribArray(a1);
    gl.vertexAttribPointer(a1,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,g.cbuf);
    const a2=gl.getAttribLocation(p,"aCol"); gl.enableVertexAttribArray(a2);
    gl.vertexAttribPointer(a2,3,gl.FLOAT,false,0,0);
  }
  bindLn(p,g){
    const gl=this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER,g.buf);
    const a1=gl.getAttribLocation(p,"aPos"); gl.enableVertexAttribArray(a1);
    gl.vertexAttribPointer(a1,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,g.cbuf);
    const a2=gl.getAttribLocation(p,"aCol"); gl.enableVertexAttribArray(a2);
    gl.vertexAttribPointer(a2,3,gl.FLOAT,false,0,0);
  }
  project(p){
    const v=this.view, pr=this.proj;
    const mv=[v[0]*p[0]+v[4]*p[1]+v[8]*p[2]+v[12],
              v[1]*p[0]+v[5]*p[1]+v[9]*p[2]+v[13],
              v[2]*p[0]+v[6]*p[1]+v[10]*p[2]+v[14]];
    const cw=-mv[2]; if(cw<=0.001) return null;
    const cx=pr[0]*mv[0], cy=pr[5]*mv[1];
    return {x:(cx/cw*0.5+0.5)*this.cssW, y:(1-(cy/cw*0.5+0.5))*this.cssH, z:cw};
  }
  placeLabels(cur){
    const eye=nrm(this.eye);
    AXES.forEach((ax,i)=>{const L=this.labels[i]; const d=[i===0?1:0,i===1?1:0,i===2?1:0];
      const m=cur.mirror?DATA.mirror[this.sphere.sex]:[1,1,1];
      const p=[1.34*d[0]*m[0],1.34*d[1]*m[1],1.34*d[2]*m[2]];
      const s=this.project(p); L.el.style.display=s?"block":"none";
      if(s){L.el.style.left=s.x+"px";L.el.style.top=s.y+"px";}});
    const st=DATA.params.azimuth_step_deg; let k=3;
    for(let d=0;d<360;d+=st,k++){
      const L=this.labels[k]; if(!L||L.kind!=="tick") continue;
      const m=cur.mirror?DATA.mirror[this.sphere.sex]:[1,1,1];
      let p=sph(0,L.phi,1.16); p=[p[0]*m[0],p[1]*m[1],p[2]*m[2]];
      const s=this.project(p);
      const front=dot(nrm(p),eye)>0.02;
      if(s&&front){L.el.style.display="block";L.el.style.left=s.x+"px";L.el.style.top=s.y+"px";}
      else L.el.style.display="none";
    }
    (this.iotLbl||[]).forEach(L=>{
      const s=this.project(L.p);
      if(s){L.el.style.display="block";
            L.el.style.left=(s.x+11)+"px"; L.el.style.top=(s.y-11)+"px";}
      else L.el.style.display="none";
    });
  }
  pick(e){
    const r=this.cv.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    let best=null,bd=13;
    this.geo.mk.list.forEach(o=>{
      const s=this.project(o.p); if(!s) return;
      const d=Math.hypot(s.x-mx,s.y-my);
      if(d<bd){bd=d;best={o:o,s:s};}
    });
    if(!best){this.tip.style.display="none";return;}
    const u=best.o.u;
    this.tip.innerHTML=`<b>${u.label||u.uid}</b><br>
      <span class="kv">坐标系</span> θ仰角 ${u.theta_deg.toFixed(1)}° · φ方位角 ${u.phi_deg.toFixed(1)}° · r ${best.o.r.toFixed(3)}<br>
      <span class="kv">三分量</span> X ${u.x.toFixed(2)} · Y ${u.y.toFixed(2)} · Z ${u.z.toFixed(2)}<br>
      <span class="kv">合成色</span> <span class="sw" style="background:${best.o.hex}"></span>${best.o.hex}<br>
      <span class="kv">${u.meta||""}</span>`;
    this.tip.style.display="block";
    this.tip.style.left=Math.min(this.cssW-258,Math.max(2,best.s.x+12))+"px";
    this.tip.style.top=Math.max(2,best.s.y-10)+"px";
  }
}

/* ---------- 图注文本解析（可编辑文本文件 → 参数实例化） ---------- */
function parseCaption(txt){
  const cfg={params:{},spheres:{},body:[]}; let sec="";
  txt.split(/\r?\n/).forEach(raw=>{
    const line=raw.replace(/\s+$/,"");
    const m=line.match(/^\s*\[(.+?)\]\s*$/);
    if(m){sec=m[1].trim();return;}
    if(/^\s*#/.test(line)||line==="") {if(sec==="图注正文"&&line!=="")cfg.body.push("");return;}
    const kv=line.match(/^\s*([A-Za-z_][\w]*)\s*=\s*(.*)$/);
    if(kv&&(sec==="参数"||sec==="球")){ (cfg.params)[kv[1]]=kv[2]; return; }
    if(sec==="图注正文") cfg.body.push(line);
  });
  return cfg;
}
function applyParams(cfg){
  const P=DATA.params, N=n=>{const v=parseFloat(n);return isNaN(v)?null:v;};
  if(cfg.params.rings) P.rings=Math.max(6,Math.min(200,N(cfg.params.rings)||P.rings));
  if(cfg.params.seg) P.seg=Math.max(8,Math.min(300,N(cfg.params.seg)||P.seg));
  if(cfg.params.arrow_head) P.arrow_head=N(cfg.params.arrow_head)||P.arrow_head;
  if(cfg.params.dot_iot) P.dot_iot=N(cfg.params.dot_iot)||P.dot_iot;
  if(cfg.params.elev_ticks_deg) {
    P.elev_ticks_deg=cfg.params.elev_ticks_deg.split(",").map(s=>parseFloat(s)).filter(v=>!isNaN(v));
  }
  if(cfg.params.azimuth_step_deg){
    const st=N(cfg.params.azimuth_step_deg); if(st&&360%st===0) P.azimuth_step_deg=st;
  }
  if(cfg.params.view_elev_deg) CAM.elev=(N(cfg.params.view_elev_deg)||0)*Math.PI/180;
  if(cfg.params.view_azim_deg) CAM.azim=(N(cfg.params.view_azim_deg)||0)*Math.PI/180;
  if(cfg.params.mirror_point_cloud!==undefined)
    window.__ST_STATE__.mirror = (String(cfg.params.mirror_point_cloud).trim()!=="0");
  P.cloud_alpha_rim  = N(cfg.params.cloud_alpha_rim)||P.cloud_alpha_rim;
  P.cloud_alpha_face = N(cfg.params.cloud_alpha_face)||P.cloud_alpha_face;
  P.cloud_point_size = N(cfg.params.cloud_point_size)||P.cloud_point_size;
  P.marker_point_size= N(cfg.params.marker_point_size)||P.marker_point_size;
  P.iot_point_size   = N(cfg.params.iot_point_size)||P.iot_point_size;
  Object.assign(DATA.captions, cfg.spheres);
  if(cfg.body.length) DATA.captions[window.__ST_STATE__.activeCapKey||"总览"]=cfg.body.join("\n");
}

      </figcaption>`;
    grid.appendChild(fig);
    fig.querySelector(".cap").textContent = DATA.captions[sp.name]||"";
    VIEWS.push(new SphereView(sp, fig));
  });
  // 总览图注（跨三球，附在图下）
  const ov=document.createElement("figure");
  ov.style.gridColumn="1 / -1";
  ov.innerHTML=`<figcaption>
      <h4>总览图注 · 三球统一说明与数字↔语义映射表（文本可编辑）</h4>
      <pre class="cap" style="max-height:430px" id="cap-总览"></pre>
      <div class="capbar">
        <button data-edit="总览">编辑总览图注</button>
        <button data-exp="总览">导出总览图注 .txt</button>
        <button data-imp="总览">从文件载入 .txt</button>
      </div>
      <div class="ed" id="ed-总览"><textarea spellcheck="false"></textarea>
        <div class="capbar"><button data-apply="总览">应用参数并重绘</button>
        <button data-close="总览">收起</button></div></div>
    </figcaption>`;
  document.querySelector("footer").before(ov);
  document.getElementById("cap-总览").textContent = DATA.captions["总览"]||"";
  // 轴色表
  let th="<table><tr><th>轴</th><th>I (−1)</th><th>O (0) 共用基准</th><th>T (+1)</th></tr>";
  AXES.forEach(ax=>{const E=AXIS_EP[ax];
    const cell=k=>`<span class="sw" style="background:${E[k].hex}"></span>${E[k].nm} ${E[k].nm_}nm`;
    th+=`<tr><td><b>${ax}</b> ${{"X":"左右","Y":"前后","Z":"上下(脚→头)"}[ax]}</td>
      <td>${cell("I")}</td><td>${cell("O")}</td><td>${cell("T")}</td></tr>`;});
  th+="</table>";
  document.getElementById("axisTable").innerHTML=th;
  document.getElementById("axiomNote").innerHTML=
    `ramp(t,axis) 在 [−1,0,+1] 三色间逐通道线性插值；合成色 `+
    `<code>w<sub>i</sub> = clip(|v<sub>i</sub>|,0,1)</code>，<code>k = max(w<sub>i</sub>)</code>，`+
    `<code>C = (1−k)·绿 + k·(Σ w<sub>i</sub>c<sub>i</sub> / Σ w<sub>i</sub>)</code>。`+
    `基准绿 <code>#00B050 (533nm)</code>。O 点任意轴回到基准绿；三轴同强时颜色趋向三端色加权混合；`+
    `<b>镜像算子 M(女)=diag(−1,−1,+1) 只改 (x,y) 符号 ⇒ |v<sub>i</sub>| 不变 ⇒ 合成色守恒</b>`+
    `（母/子/父 三球轴色表完全相同）。`;
  // 按钮
  const $=id=>document.getElementById(id);
  $("btnAuto").onclick=e=>{window.__ST_STATE__.auto=!window.__ST_STATE__.auto;
    e.target.classList.toggle("on",window.__ST_STATE__.auto);
    e.target.textContent="自动旋转 "+(window.__ST_STATE__.auto?"开":"关");};
  $("btnMirror").onclick=e=>{window.__ST_STATE__.mirror=!window.__ST_STATE__.mirror;
    e.target.classList.toggle("on",window.__ST_STATE__.mirror);
    e.target.textContent="镜像对照 "+(window.__ST_STATE__.mirror?"开":"关");rebuildAll();};
  $("btnGrid").onclick=e=>{window.__ST_STATE__.showGrid=!window.__ST_STATE__.showGrid;
    e.target.classList.toggle("on",window.__ST_STATE__.showGrid);
    e.target.textContent="球面点云 "+(window.__ST_STATE__.showGrid?"开":"关");};
  $("btnAxes").onclick=e=>{window.__ST_STATE__.showAxes=!window.__ST_STATE__.showAxes;
    e.target.classList.toggle("on",window.__ST_STATE__.showAxes);
    e.target.textContent="坐标轴 "+(window.__ST_STATE__.showAxes?"开":"关");};
  $("btnReset").onclick=()=>{CAM.elev=DATA.params.view_elev_deg*Math.PI/180;
    CAM.azim=DATA.params.view_azim_deg*Math.PI/180;CAM.dist=3.05;};
  $("btnV1").onclick=()=>{CAM.elev=20*Math.PI/180;CAM.azim=-60*Math.PI/180;};
  $("btnV2").onclick=()=>{CAM.elev=0;CAM.azim=-90*Math.PI/180;};
  $("btnV3").onclick=()=>{CAM.elev=88*Math.PI/180;CAM.azim=-90*Math.PI/180;};
  $("btnV4").onclick=()=>{CAM.elev=0;CAM.azim=0;};
  $("scaleR").oninput=e=>{window.__ST_STATE__.scaleK=parseFloat(e.target.value);
    $("scaleRv").textContent=parseFloat(e.target.value).toFixed(2);rebuildAll();};
  $("btnShot").onclick=exportAll;
  document.addEventListener("click",ev=>{
    const b=ev.target.closest("button"); if(!b) return;
    const k=b.dataset.edit||b.dataset.exp||b.dataset.imp||b.dataset.apply||b.dataset.close;
    if(!k) return;
    if(b.dataset.edit){
      const ed=document.getElementById("ed-"+k); ed.classList.toggle("open");
      if(ed.classList.contains("open"))
        ed.querySelector("textarea").value = bootstrapCaption(k);
    }
    if(b.dataset.close){document.getElementById("ed-"+k).classList.remove("open");}
    if(b.dataset.apply){
      const txt=document.getElementById("ed-"+k).querySelector("textarea").value;
      window.__ST_STATE__.activeCapKey=k;
      const cfg=parseCaption(txt);
      cfg.spheres[k]=cfg.body.join("\n");
      applyParams(cfg);
      document.getElementById("cap-"+k).textContent=cfg.body.join("\n");
      rebuildAll();
    }
    if(b.dataset.exp){
      const txt=document.getElementById("ed-"+k).classList.contains("open")
        ? document.getElementById("ed-"+k).querySelector("textarea").value
        : (bootstrapCaption(k));
      download(`图注-${k}.txt`, txt);
    }
    if(b.dataset.imp){
      const inp=document.createElement("input"); inp.type="file"; inp.accept=".txt,text/plain";
      inp.onchange=()=>{const f=inp.files[0]; if(!f) return;
        const rd=new FileReader();
        rd.onload=()=>{const cfg=parseCaption(rd.result);
          window.__ST_STATE__.activeCapKey=k;
          cfg.spheres[k]=cfg.body.join("\n");
          applyParams(cfg);
          document.getElementById("cap-"+k).textContent=cfg.body.join("\n");
          const ed=document.getElementById("ed-"+k);
          ed.classList.add("open"); ed.querySelector("textarea").value=rd.result;
          rebuildAll();};
        rd.readAsText(f,"utf-8");};
      inp.click();
    }
  });
  // 尝试从同目录 txt 载入（HTTP 环境下生效；file:// 下自动回退内嵌文本）
  try{
    ["母","子","父","总览"].forEach(n=>{
      fetch("图注-"+n+".txt").then(r=>r.ok?r.text():null).then(t=>{
        if(!t) return;
        const cfg=parseCaption(t); cfg.spheres[n]=cfg.body.join("\n");
        applyParams(cfg);
        document.getElementById("cap-"+n).textContent=cfg.body.join("\n");
        rebuildAll();
      }).catch(()=>{});
    });
  }catch(e){}
  requestAnimationFrame(loop);
  window.__ST_HEALTH__.booted = true;
  window.__ST_HEALTH__.views = VIEWS.length;
}
function bootstrapCaption(k){
  const sp=DATA.spheres.find(s=>s.name===k);
  const head = sp
    ? `# tcmP 三维极坐标语义张量 · ${sp.no}${k}球面 · 图注（可编辑文本）\n`+
      `[球]\nno = ${sp.no}\nname = ${k}\nsex = ${sp.sex}\n`+
      `sign = ${sp.sign.join(" ")}\nangle_x = ${sp.angle_x}\nangle_y = ${sp.angle_y}\n`+
      `angle_z = ${sp.angle_z}\nxy_face = ${sp.xy_face}\nmirror_point_cloud = ${sp.sex==="女"?1:1}\n\n`
    : `# tcmP 三维极坐标语义张量 · 总览图注（可编辑文本）\n[球]\nname = 总览\n\n`;
  return head + `[参数]\nrings = ${DATA.params.rings}\nseg = ${DATA.params.seg}\n`+
    `azimuth_step_deg = ${DATA.params.azimuth_step_deg}\nelev_ticks_deg = ${DATA.params.elev_ticks_deg.join(",")}\n`+
    `arrow_head = ${DATA.params.arrow_head}\ndot_iot = ${DATA.params.dot_iot}\n`+
    `cloud_point_size = ${DATA.params.cloud_point_size}\nmarker_point_size = ${DATA.params.marker_point_size}\n`+
    `iot_point_size = ${DATA.params.iot_point_size}\n`+
    `cloud_alpha_rim = ${DATA.params.cloud_alpha_rim}\ncloud_alpha_face = ${DATA.params.cloud_alpha_face}\n`+
    `view_elev_deg = ${DATA.params.view_elev_deg}\nview_azim_deg = ${DATA.params.view_azim_deg}\n\n`+
    `[图注正文]\n${DATA.captions[k]||""}\n`;
}
function rebuildAll(){VIEWS.forEach(v=>v&&v.rebuild&&v.rebuild());}
function download(name,txt){
  const b=new Blob([txt],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportAll(){
  // 三球横向拼合导出（含 HTML 叠加层的轴名 / 刻度 / I-O-T 标签）
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=VIEWS[0].cv.width, h=VIEWS[0].cv.height, gap=Math.round(14*dpr);
  const cv=document.createElement("canvas"); cv.width=w*3+gap*2; cv.height=h;
  const ctx=cv.getContext("2d"); ctx.fillStyle="#0b0e13"; ctx.fillRect(0,0,cv.width,cv.height);
  VIEWS.forEach((v,i)=>ctx.drawImage(v.cv, i*(w+gap), 0, w, h));
  ctx.textAlign="center"; ctx.textBaseline="middle";
  VIEWS.forEach((v,i)=>{
    const cr=v.cv.getBoundingClientRect();
    const sx=v.cv.width/Math.max(1,cr.width), sy=v.cv.height/Math.max(1,cr.height);
    v.stage.querySelectorAll(".lbl.dyn").forEach(el=>{
      const st=getComputedStyle(el);
      if(st.display==="none") return;
      const r=el.getBoundingClientRect();
      if(r.width===0) return;
      const x=(r.x-cr.x+r.width/2)*sx + i*(w+gap);
      const y=(r.y-cr.y+r.height/2)*sy;
      const isAxis=el.classList.contains("axis");
      const isIot=el.classList.contains("iot");
      const px=isAxis?16*dpr:(isIot?13*dpr:13.5*dpr);
      ctx.font=(isAxis?"bold ":"")+px+"px 'Microsoft YaHei',sans-serif";
      ctx.fillStyle=st.color;
      ctx.lineWidth=3*dpr; ctx.strokeStyle="rgba(0,0,0,.85)";
      ctx.strokeText(el.textContent, x, y);
      ctx.fillText(el.textContent, x, y);
    });
  });
  const F=Math.round(17*dpr);
  ctx.font=`bold ${F}px "Microsoft YaHei",sans-serif`;
  ctx.textAlign="left";
  DATA.spheres.forEach((sp,i)=>{
    const x=i*(w+gap)+Math.round(16*dpr), y=Math.round(26*dpr);
    ctx.lineWidth=4*dpr; ctx.strokeStyle="rgba(0,0,0,.85)";
    ctx.strokeText(sp.no+sp.name, x, y); ctx.fillStyle="#ffffff"; ctx.fillText(sp.no+sp.name, x, y);
  });
  const note=`θ=仰角 θ∈[−90°,+90°]  φ=方位角 φ∈[0°,360°)  r=尺度∈(0,1]   X=r·cosθ·cosφ  Y=r·cosθ·sinφ  Z=r·sinθ`;
  ctx.font=`${Math.round(14*dpr)}px "Microsoft YaHei",sans-serif`;
  ctx.fillStyle="#93a1bd";
  ctx.textAlign="left";
  ctx.fillText(note, Math.round(16*dpr), h-Math.round(16*dpr));
  const a=document.createElement("a");
  a.href=cv.toDataURL("image/png"); a.download="母子父-三维极坐标语义球面-同步旋转.png"; a.click();
}
let last=performance.now();
function loop(t){
  const dt=(t-last)/1000; last=t;
  if(window.__ST_STATE__.auto) CAM.azim += dt*0.20;
  VIEWS.forEach(v=>v&&v.draw&&v.draw());
  requestAnimationFrame(loop);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
</script>
</body>
</html>
