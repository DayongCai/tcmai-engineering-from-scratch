name: curriculum

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curriculum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 阻断门：课程结构与章节契约 ──────────────────────────────
  audit:
    name: "课程审计（结构 + 契约）"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成课程表与索引
        run: |
          node scripts/build_catalog.js
          node scripts/build_roadmap.js
          node scripts/build_doc_indexes.js

      - name: L0/L1/L2 三层审计
        run: node scripts/audit_curriculum.js

      - name: 学习路径校验
        run: node tests/test_learning_paths.js

      - name: 课程结构与章节契约测试
        run: node tests/test_curriculum_contract.js

      - name: 桥梁表与术语表校验
        run: node tests/test_glossary_bridge.js

      - name: 内容复核（机器可判部分）
        run: node tests/test_content_review.js

  # ── 阻断门：每个已建章节的代码必须真的能跑 ──────────────────
  chapters:
    name: "章节代码可执行性"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build_catalog.js
      - name: 逐章运行 main.js 与单元测试
        run: node tests/test_chapter_code.js

  # ── 阻断门：站点生成物形状 ─────────────────────────────────
  site-artifacts:
    name: "tcmP 站点构建与生成物校验"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build_catalog.js
      - run: node site/pages.js
      - run: node site/build.js
      - run: node tests/test_site_artifacts.js
      - uses: actions/upload-artifact@v4
        with:
          name: tcmP-site
          path: site/
          retention-days: 14

  # ── 阻断门：证候辞典（数据层 → 编码器 → 接口 → 百姓页） ─────────
  #
  # 为什么单列一个 job：这条线的东西（build_zhenghou_cidian.py / zhenghou_encode.js /
  # zhenghou_api.js / site/zhenghou.html）以前只在本地 npm run check 里跑，
  # CI 管不到 —— 换句话说，改坏了没人拦。这里四层一次跑完：
  #   数据（--check 幂等）→ 编码器（15 黄金样例）→ 接口（9+1 断言）→ 页面（5 断言）。
  # 只用 Python 标准库，不需要 pip 装任何东西。
  zhenghou:
    name: "证候辞典：数据 / 编码器 / 接口 / 百姓页"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 数据层幂等（structures / 语素 / 张量 / 18+ 件辞典）
        run: python scripts/build_zhenghou_cidian.py --check

      - name: 辞典断言（结构 / 正文 / 图注 / 全文转写）
        run: node --test tests/test_zhenghou_cidian.js

      - name: 编码器黄金样例（12 门 + 两条危候 + 负例）
        run: |
          node scripts/zhenghou_encode.js --check
          node --test tests/test_zhenghou_encode.js

      - name: 接口层自检（/health /encode /search /hou /openapi.json）
        run: |
          node scripts/zhenghou_api.js --check
          node --test tests/test_zhenghou_api.js

      - name: 百姓页与内核同源（页面内核 == 接口结论）
        run: |
          node scripts/build_zhenghou_site.js --check
          node --test tests/test_zhenghou_site.js

  # ── 咨询门：README 计数漂移（main 上自愈，PR 上只提示） ──────
  counts-drift:
    name: "README 计数一致性（咨询）"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build_catalog.js
      - run: node scripts/check_readme_counts.js
        continue-on-error: true

  # ── main 自愈：重建生成物并提交 ─────────────────────────────
  rebuild-artifacts:
    name: "重建生成物（仅 main）"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [audit, chapters]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 重建 catalog / ROADMAP / 院系索引 / 站点数据
        run: |
          node scripts/build_catalog.js
          node scripts/build_roadmap.js
          node scripts/build_doc_indexes.js
          node site/pages.js
          node site/build.js
          # 证候辞典：数据层（正文层 JSON 变了就要重出 19 件）与百姓页
          python scripts/build_zhenghou_cidian.py || true
          node scripts/build_zhenghou_site.js || true

      - name: 同步 README 计数块
        run: node scripts/check_readme_counts.js --fix

      - name: 同步 learning-paths 计数
        run: node tests/test_learning_paths.js --fix

      - name: 提交变更（无变更时跳过）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json ROADMAP.md departments/ site/ learning-paths/ README.md standards/zhenghou-cidian/ textbooks/01-zhongyi/14-zhongyi-zhenghou-xue/
          if git diff --cached --quiet; then
            echo "无生成物变更"
          else
            git commit -m "chore(build): 重建生成物 [skip ci]"
            git push
          fi

  # ── 教材流水线 ────────────────────────────────────────────
  textbooks:
    name: "textbooks 教材汇总与事实校核"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build_catalog.js
      - run: node textbooks/build_book.js --check
      - run: node textbooks/build_book.js --all

  # ── tcmP 视频流水线（第 1–3 段可跑，第 4 段需 ffmpeg） ──────
  video-pipeline:
    name: "tcmP 讲稿与幻灯片（不含成片）"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 探测工具链
        run: node platform/pipeline/check_tools.js
      - name: 抽取讲稿与幻灯片
        run: |
          if [ -d platform/courses ]; then
            for c in $(ls -d platform/courses/*/*/ 2>/dev/null | sed 's|platform/courses/||; s|/$||'); do
              node platform/pipeline/extract_narration.js "$c" || true
              node platform/pipeline/build_slides.js "$c" || true
            done
          fi
      - name: 断言每集都有免责声明卡
        run: node tests/assert_disclaimers.js
      - uses: actions/upload-artifact@v4
        with:
          name: tcmP-slides
          path: platform/courses/**/slides/
          retention-days: 14

  # 画面帧 + 静音成片：这两段在 ubuntu-latest 上靠预装的 Chrome 与 ffmpeg 就能跑通，
  # 不需要任何 pip 安装。TTS 不在此处合成（Linux runner 没有 SAPI，edge-tts 会 403），
  # 所以 CI 产出的是**静音轨**——恰好用来验证「无配音时流水线仍能出片」这条降级路径。
  #
  # 说明：本机（Windows）已逐段实测通过，但本 job 未经真实 CI 执行过 ——
  # 因此设 continue-on-error，避免把一个未验证的 job 变成阻断项。
  video-render:
    name: "tcmP 画面帧与静音成片（Ubuntu 预装 Chrome + ffmpeg）"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: video-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 确认 Chrome 与 ffmpeg 可用
        run: |
          which google-chrome ffmpeg ffprobe
          google-chrome --version; ffmpeg -version | head -1
      - name: 导出画面帧
        run: |
          if [ -d platform/courses ]; then
            for c in $(ls -d platform/courses/*/*/ 2>/dev/null | sed 's|platform/courses/||; s|/$||'); do
              node platform/pipeline/render_frames.js "$c" || true
            done
          fi
      - name: 合成静音成片
        run: |
          if [ -d platform/courses ]; then
            for c in $(ls -d platform/courses/*/*/ 2>/dev/null | sed 's|platform/courses/||; s|/$||'); do
              node platform/pipeline/build_video.js "$c" || true
            done
          fi
      - name: 断言成片可被 ffprobe 读出时长
        run: |
          found=0
          for f in $(find platform/courses -name lesson.mp4 2>/dev/null); do
            found=1
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            echo "$f → ${d}s"
            awk -v d="$d" 'BEGIN { if (d <= 0) exit 1 }' || { echo "❌ 时长非法: $f"; exit 1; }
          done
          [ "$found" = 1 ] || echo "（无成片：本仓当前可能没有可渲染的章节）"
      - uses: actions/upload-artifact@v4
        with:
          name: tcmP-video
          path: platform/courses/**/video/lesson.mp4
          retention-days: 7
          if-no-files-found: ignore
