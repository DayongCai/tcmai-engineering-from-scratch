# [tcmP] 课程编排 · 07-zhineng/19-zhineng-biye-sheji
#
# 由 node scripts/scaffold_course_yaml.js 生成（首版）。之后手工维护：
# 单一事实来源是 departments/07-zhineng/19-zhineng-biye-sheji/chapters/<slug>/docs/zh.md；
# 本文件只登记「讲什么、什么状态」，不重复正文。
#
# chapters[].slug 必须与 chapters/ 下的目录名完全一致，否则 extract_narration.js 报错退出。
# `video: planned` = 可渲染（正文在），不是已渲染；
# 状态词只有五档：planned / narration-ready / slides-ready / rendered / published，
# 必须与磁盘实况一致（tests/test_platform_pipeline.js 逐章核）。

