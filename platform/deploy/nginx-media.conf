# tcm-media · nginx 站点片段（校内/局域网）
#
# 用法（Linux 服务器）：
#   sudo cp nginx-media.conf /etc/nginx/conf.d/tcm-media.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 用法（Windows 试跑，验证配置本身）：
#   nginx.exe -p <工作目录> -c nginx.conf -t
#
# 三个必须项（缺一个 APP 就播不动）：
#   1) Range → nginx 默认支持（sendfile on），不要关 max_ranges；
#   2) CORS → 每个 location 都要写 add_header（**子块会覆盖父块的 add_header**）；
#   3) MIME → m3u8 / m4s / vtt 必须显式给类型，否则播放器报「清单解析失败」。
#
# 清单与分片的缓存策略相反：
#   m3u8 / json / vtt  → max-age=60（改了要能立刻生效）
#   m4s  / ts   / jpg  → max-age=31536000, immutable（内容不可变，名字变了就换 URL）

server {
    listen      8080;
    server_name _;                     # 校内直接用 IP:8080；有域名就把这里换成域名

    # 媒体根目录：deploy.sh 默认把 D:/tcm-media 同步到这里
    root        /srv/tcm-media;
    index       index.json;

    # 分片已是 h264/aac 码流，再 gzip 只会浪费 CPU
    gzip        off;

    # 关掉长连接：ffmpeg 的 hls 解复用器在复用连接取变体清单时会判定「Invalid data」，
    # 关掉 keep-alive 后与 `python -m http.server` 行为一致，master 立刻可解析（实测）。
    # 代价是每个分片一次 TCP 握手——局域网/内网可忽略。
    keepalive_timeout 0;
    sendfile    on;
    tcp_nopush  on;
    # 大文件走 sendfile，别让 nginx 读进内存
    output_buffers 4 256k;

    # 不让浏览器目录列表泄露结构；APP 只认 index.json
    autoindex   off;

    # 显式类型表（覆盖默认 mime.types 里没有的那几个）
    types {
        application/vnd.apple.mpegurl  m3u8;
        video/iso.segment              m4s;
        video/mp4                      mp4;
        video/mp2t                     ts;
        text/vtt                       vtt;
        application/json               json;
        image/jpeg                     jpg jpeg;
        image/png                      png;
    }
    default_type application/octet-stream;

    # 站点级默认头：任何没被 location 里 add_header 覆盖的响应都会带上
    add_header Access-Control-Allow-Origin   "*" always;
    add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers  "Range, Content-Type" always;
    add_header Access-Control-Max-Age        86400 always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    # 预检（hls.js 这类带 Range 的请求会先发 OPTIONS）
    # 注意：`add_header` 不允许出现在 if 里（nginx 会报 "directive is not allowed here"），
    # 所以这里只做 return；CORS 头由上面的站点级 add_header 负责。
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ① 清单：短缓存 + CORS
    location ~* \.m3u8$ {
        # 清单只有几 KB，关掉 Range：ffmpeg 取变体清单时会带 `Range: bytes=0-`，
        # 收到 206 后判定「不是合法播放列表」，master 里所有档位全解析失败（实测）。
        max_ranges 0;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri =404;
    }

    location ~* \.(json|vtt)$ {
        max_ranges 0;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri =404;
    }

    # ② 分片与封面：一年不朽
    location ~* \.(m4s|ts|mp4|jpg|jpeg|png)$ {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ③ 根路径给课程总清单（APP 直接拿 / 即可起步）
    location = / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=60" always;
        try_files /index.json =404;
    }

    # 健康检查：部署脚本用它确认「改了 conf、reload 成功、媒体在」
    location = /healthz {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Type "application/json" always;
        return 200 '{"ok":true,"service":"tcm-media"}';
    }

    # ④（可选）短期签名 URL / IP 白名单 —— 校内默认关掉
    #    开了之后 APP 要带 ?token=...，见 platform/MEDIA-DELIVERY.md §3.A 的防盗链说明
    # location / {
    #     if ($arg_token != "REPLACE_ME") { return 403; }
    #     try_files $uri =404;
    # }
    #
    # location / {
    #     allow 192.168.0.0/16;
    #     deny  all;
    #     try_files $uri =404;
    # }
}
